name: Twinplic
options:
  bundleIdPrefix: com.twinplic
  deploymentTarget:
    macOS: "14.0"
packages:
  TwinplicCore:
    path: .
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: TwinplicCore
    settings:
      base:
        PRODUCT_NAME: Twinplic
        PRODUCT_BUNDLE_IDENTIFIER: com.twinplic.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        # A stable identity, because macOS ties Full Disk Access to the signature. An ad hoc
        # signature changes with every build, which silently cancels the grant.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: U4ZLRP8FWD
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Twinplic backs up the folders you choose.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Twinplic backs up the folders you choose.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Twinplic backs up the folders you choose.
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: Twinplic backs up to and from the network disks you choose.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Twinplic backs up to and from the disks you choose.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Twinplic:
    templates:
      - App
  Twinplic-Intel:
    templates:
      - App
    settings:
      base:
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
