name: CopyFX
options:
  bundleIdPrefix: com.copyfx
  deploymentTarget:
    macOS: "14.0"
packages:
  CopyFXCore:
    path: .
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: CopyFXCore
    settings:
      base:
        PRODUCT_NAME: CopyFX
        PRODUCT_BUNDLE_IDENTIFIER: com.copyfx.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # A stable identity, because macOS ties Full Disk Access to the signature. An ad hoc
        # signature changes with every build, which silently cancels the grant.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: U4ZLRP8FWD
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: CopyFX backs up the folders you choose.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: CopyFX backs up the folders you choose.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: CopyFX backs up the folders you choose.
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: CopyFX backs up to and from the network disks you choose.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: CopyFX backs up to and from the disks you choose.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  CopyFX:
    templates:
      - App
  CopyFX-Intel:
    templates:
      - App
    settings:
      base:
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
